name: Daily APMC Mandi Price Collector

on:
  schedule:
    # 13:00 UTC = 18:30 IST (Mon-Sat, after APMC trading closes)
    - cron: '0 13 * * 1-6'
  workflow_dispatch:

jobs:
  collect-mandi-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Collect and Upsert Rajasthan Mandi Prices
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/collect_mandi.py --upsert-db

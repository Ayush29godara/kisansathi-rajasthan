name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run code formatting / syntax checks
        run: |
          python -m py_compile backend/app/*.py backend/routers/*.py backend/services/*.py

      - name: Run Pytest suite
        env:
          PORT: 8000
          ENVIRONMENT: test
          FRONTEND_ORIGIN: http://localhost:5173
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: mock_key
          SUPABASE_JWT_SECRET: mock_secret_value_for_testing_purposes_only
          GEMINI_API_KEY: mock_gemini_api_key
        run: |
          cd backend
          pytest -v tests/

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit
